# What the machine checks while "run before pushing" governs the person.
#
# The matrix is not decoration: on 3 September 2026 `crypto.randomUUID()` landed
# without an import. Global `crypto` appeared in Node 19 while `engines` promises
# 18, where the office did not start at all. Review found it; this makes it fail
# before a merge.
#
# `npm test` uses tools/run-tests.mjs. Built-in `node --test` accepts directories
# on Node 20 and globs on Node 22, with no spelling shared by both. Verified on
# 4 September 2026; hence the custom traversal.
#
# There is nothing to install: the project has no dependencies, so there is no
# `npm ci` or cache. This checkout contains only the free modules, so CI runs the
# exact free build that local machines with private modules do not.
name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# Superseded PR commits need no result; main runs still finish their audit.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Private staging sets CI_RUNNER_LABELS to its dedicated runner labels.
# Public clones default to GitHub-hosted Linux without private infrastructure.
jobs:
  test:
    runs-on: ${{ fromJSON(vars.CI_RUNNER_LABELS || '["ubuntu-latest"]') }}
    timeout-minutes: 15
    strategy:
      fail-fast: false        # A failure on 18 still leaves 20 and 22 useful.
      matrix:
        node: ['18', '20', '22']
    name: node ${{ matrix.node }}
    steps:
      # v5 rather than v4: actions run their own Node inside the runner, and v4
      # uses Node 20, which GitHub retires on 23 September 2026. The first green
      # run on 4 September showed three warnings about this—not our code or the
      # matrix below, which controls the office runtime.
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node }}
      - name: syntax
        run: |
          for f in server/*.js web/*.js modules/*/*.js tools/*.mjs tools/lib/*.mjs; do
            node --check "$f" || exit 1
          done
      - name: tests
        run: npm test
      # Node 20 and 22 detect modules by syntax while Node 18 does not, so the
      # module-loader stand once failed only there. Disable detection on newer
      # versions too: a substitute module without package.json is then tested
      # three times rather than only in the oldest column.
      - name: tests, without module detection
        if: matrix.node != '18'
        run: node --no-experimental-detect-module tools/run-tests.mjs
      # The release dry run reads history and package.json and can fail silently,
      # for example on an unparseable version. It is cheaper to check here.
      - name: release dry run
        run: node tools/release.mjs patch --dry

  # Coverage is a separate job on one Node version: the number does not depend
  # on the version, and running it three times pays three times for one result.
  #
  # Use `npx`, not a package.json dependency. Having none is a README promise:
  # no `npm install`, no `node_modules`. Coverage must not break it, so c8 arrives
  # for this step with its major pinned; otherwise CI could turn red because of
  # somebody else's release rather than our code.
  #
  # CI and people share one command: `npm run coverage` in package.json, invoked
  # here. Two copies would drift and make local and machine figures differ.
  #
  # A floor, not a target: 70 lines and 55 functions against today's 75.9 and 62.
  # The margin is deliberate. A threshold touching the current number turns red
  # on ordinary edits and gets bypassed; this one stays quiet until coverage
  # collapses because part of the office has no stand at all.
  coverage:
    runs-on: ${{ fromJSON(vars.CI_RUNNER_LABELS || '["ubuntu-latest"]') }}
    timeout-minutes: 15
    name: coverage
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: coverage
        shell: bash
        run: |
          set -eo pipefail
          npm run coverage 2>&1 | tee /tmp/coverage.txt
      # Keep the number visible rather than buried in logs. The summary goes on
      # the run page; otherwise nobody opens it and computing it is pointless.
      - name: summary
        if: always()
        shell: bash
        run: |
          {
            echo '```'
            sed -n '/Coverage summary/,/^=\{10,\}$/p' /tmp/coverage.txt || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  # GitHub deletes the head branch after a PR merge, and land.mjs removes any
  # matching local ref after the release. This delayed check is the backstop for
  # a merge path that skipped either half. It runs after the ordinary jobs so
  # GitHub has finished its server-side branch deletion before refs are read.
  branch-hygiene:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [test, coverage]
    runs-on: ${{ fromJSON(vars.CI_RUNNER_LABELS || '["ubuntu-latest"]') }}
    timeout-minutes: 15
    name: merged branches
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: fetch all branch refs
        run: git fetch origin --prune '+refs/heads/*:refs/remotes/origin/*'
      - name: no merged remote branches remain
        run: node tools/audit-merged-branches.mjs
