<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="icon" href="favicon.svg">
<title>Valey</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=Rubik+Mono+One&display=swap">

<style>
:root{
  --bg:#150e09; --bg-deep:#0e0906; --panel:#231710; --panel-hi:#2e2016;
  --wood:#4a3325; --wood-lit:#6b4a2e;
  --frame:#8a6247; --frame-dim:#5f4534;
  --ink:#f6e3c0; --ink-dim:#c9b391; --muted:#8c7660;
  --accent:#9fe0a8; --warn:#ffd166; --cool:#8fc8ff; --plum:#c39bff;
  --display:"Rubik Mono One","Courier New",monospace;
  --mono:"IBM Plex Mono",ui-monospace,"Courier New",monospace;
  --col:68ch;
}
*{box-sizing:border-box}
body{
  margin:0; background:var(--bg); color:var(--ink);
  font:400 15px/1.65 var(--mono);
  -webkit-font-smoothing:antialiased;
  background-image:radial-gradient(120% 80% at 50% 0%, #241710 0%, var(--bg) 45%, var(--bg-deep) 100%);
  background-attachment:fixed;
}
img,canvas{max-width:100%}
a{color:var(--accent); text-decoration-color:var(--frame-dim); text-underline-offset:3px}
a:hover{text-decoration-color:var(--accent)}
:focus-visible{outline:2px solid var(--warn); outline-offset:3px}
h1,h2,h3{font-family:var(--display); font-weight:400; text-wrap:balance; line-height:1.15; margin:0}

/* ---------- shell ---------- */
.wrap{max-width:1180px; margin:0 auto; padding:0 20px}
.col{max-width:var(--col); margin:0 auto}
section{padding:clamp(56px,9vw,104px) 0}
.eyebrow{
  font-size:11px; letter-spacing:.22em; text-transform:uppercase;
  color:var(--muted); display:flex; align-items:center; gap:12px; margin-bottom:18px;
}
.eyebrow::after{content:""; flex:1; height:0; border-top:1px solid var(--frame-dim); border-bottom:1px solid #1c130d}
h2{font-size:clamp(20px,3.4vw,29px); letter-spacing:-.01em; margin-bottom:14px}
.lede{color:var(--ink-dim); font-size:clamp(15px,1.9vw,17px)}
p{margin:0 0 16px}
p:last-child{margin-bottom:0}

/* ---------- hero ---------- */
.hero{padding-top:clamp(28px,5vw,56px); padding-bottom:clamp(40px,6vw,64px)}
.brandline{display:flex; align-items:baseline; gap:14px; flex-wrap:wrap; margin-bottom:22px}
.brand{font-family:var(--display); font-size:clamp(26px,5vw,46px); letter-spacing:-.02em}
.brand em{font-style:normal; color:var(--warn)}
.tag{font-size:11px; letter-spacing:.2em; text-transform:uppercase; color:var(--muted); padding-bottom:4px}
.langbar{margin-left:auto; display:flex; border:2px solid var(--frame-dim); align-self:center}
.langbar button{
  font:600 11px var(--mono); letter-spacing:.16em; background:transparent; color:var(--muted);
  border:0; padding:7px 12px; cursor:pointer;
}
.langbar button:hover{color:var(--ink)}
.langbar button[aria-pressed="true"]{background:var(--wood); color:var(--ink)}
.hero h1{font-size:clamp(21px,3.9vw,36px); letter-spacing:-.015em; max-width:17ch; margin-bottom:18px}
.hero h1 span{color:var(--warn)}
.hero .lede{max-width:56ch; margin-bottom:26px}

/* ---------- office frame ---------- */
/* Экран прижат к левому краю текста, а не центрирован в обёртке: при
   margin:0 auto он вставал на 220 против 150 у заголовка — смещение в
   70 px, которое никто не выбирал. Принято 30 августа 2026. */
.office{position:relative; margin:0; width:100%; max-width:1000px}
.screen{
  position:relative; background:#0b0704;
  border:3px solid var(--frame); box-shadow:0 0 0 3px #1a120c, 0 22px 60px rgba(0,0,0,.65);
}
.screen canvas{display:block; width:100%; height:auto; image-rendering:pixelated}
.hud{
  position:absolute; top:0; left:0; right:0; display:flex; gap:14px; align-items:center;
  padding:6px 12px; background:linear-gradient(rgba(11,7,4,.92),rgba(11,7,4,.62));
  font-size:11px; letter-spacing:.1em; text-transform:uppercase; pointer-events:none;
}
.hud b{color:var(--warn); letter-spacing:.16em; font-weight:600}
.hud .chip{color:var(--muted)}
.hud .chip.work{color:var(--accent)}
.hud .chip.wait{color:var(--warn)}
.hud .spacer{flex:1}
.keys{
  display:flex; flex-wrap:wrap; gap:8px 18px; justify-content:center;
  margin-top:12px; font-size:12px; color:var(--muted); letter-spacing:.04em;
}
kbd{
  font:600 11px/1 var(--mono); background:var(--panel-hi); color:var(--ink-dim);
  border:1px solid var(--frame-dim); border-bottom-width:2px; padding:3px 6px; margin-right:5px;
}

/* click-to-play veil */
.veil{
  position:absolute; inset:0; display:grid; place-content:center; gap:10px; justify-items:center;
  background:rgba(11,7,4,.72); backdrop-filter:blur(1px); cursor:pointer; border:0; width:100%;
  color:var(--ink); font:inherit; text-align:center; padding:20px;
}
.veil[hidden]{display:none}
.veil .play{font-family:var(--display); font-size:clamp(14px,2.4vw,20px); color:var(--warn)}
.veil small{color:var(--ink-dim); font-size:12px; letter-spacing:.06em; max-width:34ch}
.veil:hover .play{color:#fff}

/* in-office dialog */
.talk{
  position:absolute; left:50%; bottom:14px; transform:translateX(-50%);
  width:min(560px,92%); display:flex; gap:12px; padding:11px 13px;
  background:linear-gradient(var(--panel-hi),var(--panel)); border:2px solid var(--frame);
  box-shadow:0 0 0 3px #0b0704, 0 12px 34px rgba(0,0,0,.7); font-size:13px; line-height:1.5;
}
.talk[hidden]{display:none}
.talk .who{display:flex; align-items:baseline; gap:8px; flex-wrap:wrap; margin-bottom:6px}
.talk .who b{color:var(--warn); font-size:14px; letter-spacing:.05em}
.talk .role{font-size:10px; letter-spacing:.08em; text-transform:uppercase; padding:1px 6px; border:1px solid var(--frame-dim); color:var(--ink-dim)}
.talk .role.code{color:var(--accent); border-color:#3f6a48}
.talk .role.design{color:var(--plum); border-color:#5a4478}
.talk .role.research{color:var(--cool); border-color:#3f5c78}
.talk .role.plan{color:var(--warn); border-color:#6d5a2a}
.talk .act{color:var(--ink-dim); font-size:12px; border-left:3px solid var(--frame); padding-left:8px; margin-bottom:6px}
.talk .say{margin:0; color:var(--ink)}
.talk .esc{color:var(--muted); font-size:11px; margin-top:8px; letter-spacing:.06em}
.talk .body{flex:1; min-width:0}

/* touch pad */
.pad{position:absolute; inset:auto 0 0 0; display:none; justify-content:space-between; padding:12px; pointer-events:none}
.pad div{display:grid; grid-template-columns:repeat(3,44px); grid-template-rows:repeat(2,40px); gap:4px; pointer-events:auto}
.pad button{
  background:rgba(35,23,16,.85); border:2px solid var(--frame); color:var(--ink);
  font:600 15px var(--mono); touch-action:none;
}
.pad .act{grid-column:span 3; height:40px; align-self:end}
@media (pointer:coarse){.pad{display:flex}}

/* ---------- кто ты в офисе ---------- */
.cast{
  display:flex; align-items:center; gap:22px; margin-top:14px; padding:18px;
  background:var(--panel-hi); border:2px solid var(--frame);
  box-shadow:0 10px 28px rgba(0,0,0,.6);
}
.cast canvas{
  width:150px; height:170px; flex:none; image-rendering:pixelated;
  background:#231710; border:2px solid var(--frame-dim);
}
.cast-body{flex:1; min-width:0; display:grid; gap:8px}
.cast-eyebrow{font-size:11px; letter-spacing:.22em; text-transform:uppercase; color:var(--muted)}
.cast-line{display:flex; align-items:center; gap:10px; flex-wrap:wrap}
.cast-line b{font:600 22px var(--mono); color:var(--warn); letter-spacing:.03em}
.cast-role{font-size:10px; letter-spacing:.08em; text-transform:uppercase; padding:2px 6px; border:1px solid currentColor}
.cast-hint{margin:0; font-size:12.5px; line-height:1.5; color:var(--ink-dim)}
.cast-roll{
  display:inline-flex; align-items:center; gap:8px; flex:none; cursor:pointer;
  background:var(--wood); color:var(--ink); border:2px solid var(--frame); border-bottom-width:3px;
  font:600 12px var(--mono); letter-spacing:.12em; text-transform:uppercase; padding:11px 16px;
}
.cast-roll:hover{background:var(--wood-lit); color:#fff}
.cast-roll .arw{color:var(--warn); font-size:14px; line-height:1}
@media (max-width:700px){
  .cast{flex-direction:column; gap:14px}
  .cast-body{justify-items:center; text-align:center}
  .cast-line{justify-content:center}
  .cast-roll{width:100%; justify-content:center; padding:13px 16px}
}

/* ---------- pillars ---------- */
.pillars{display:grid; gap:34px; grid-template-columns:repeat(auto-fit,minmax(230px,1fr)); margin-top:34px}
.pillar canvas{width:88px; height:88px; image-rendering:pixelated; display:block; margin-bottom:14px}
.pillar h3{font-family:var(--mono); font-weight:600; font-size:16px; color:var(--ink); margin-bottom:8px; letter-spacing:-.01em}
.pillar p{color:var(--ink-dim); font-size:14px}

/* ---------- quiet note ---------- */
.note{border-left:3px solid var(--accent); padding:2px 0 2px 18px; color:var(--ink-dim)}
.note b{color:var(--ink); font-weight:600}

/* ---------- замер спроса ---------- */
.sheet{
  max-width:var(--col); margin:34px auto 0; background:#e9e3d4; color:#2a1d15;
  border:3px solid var(--frame); box-shadow:0 0 0 3px #1a120c, 0 18px 44px rgba(0,0,0,.55);
}
.sheet-head{
  display:flex; align-items:center; gap:12px; background:#4a3325; color:var(--ink);
  padding:11px 18px; font-size:11px; letter-spacing:.2em; text-transform:uppercase;
}
.sheet-head .pin{width:8px; height:8px; background:var(--warn); box-shadow:0 0 0 2px #2a1d15}
.sheet-head .n{margin-left:auto; color:var(--ink-dim); letter-spacing:.1em; font-variant-numeric:tabular-nums}
.sheet-body{padding:22px 18px 20px}
.ask{font-size:15px; line-height:1.5; margin:0 0 16px; color:#2a1d15}
.buckets{display:grid; gap:8px; grid-template-columns:repeat(auto-fit,minmax(120px,1fr))}
.buckets button{
  font:600 14px var(--mono); background:#fbf8f0; color:#2a1d15;
  border:2px solid #b3a68c; border-bottom-width:3px; padding:12px 8px; cursor:pointer;
}
.buckets button:hover:not(:disabled){background:#fff; border-color:#4a3325}
.buckets button:disabled{cursor:default; opacity:.6}
.tally{display:grid; gap:11px; margin-top:4px}
.tally .line{display:grid; gap:5px}
.tally .lab{display:flex; justify-content:space-between; font-size:13px; color:#6d5a48; font-variant-numeric:tabular-nums}
.tally .lab b{color:#2a1d15; font-weight:600}
.tally .track{height:12px; background:#d6cfbd; border:1px solid #b3a68c}
.tally .fill{height:100%; background:#6b4a2e}
.tally .mine .fill{background:#8a6247; box-shadow:inset 0 0 0 2px #ffd166}
.tally .mine .lab b::after{content:attr(data-you); color:#8a6247; font-weight:400}
.said{margin:16px 0 0; font-size:14px; color:#2a1d15}
.sheet .fine{font-size:12.5px; line-height:1.55; color:#6d5a48; margin:14px 0 0}
.reach{margin-top:20px; padding-top:18px; border-top:2px solid #d6cfbd; display:grid; gap:12px}
.reach p{margin:0; font-size:14px; line-height:1.55; color:#2a1d15}
.reach a, .reach span.off{
  font:600 13px var(--mono); letter-spacing:.12em; text-transform:uppercase;
  background:#4a3325; color:var(--ink); border:2px solid #2a1d15; border-bottom-width:3px;
  padding:11px 16px; justify-self:start; text-decoration:none;
}
.reach a:hover{background:#6b4a2e; color:#fff}
.reach span.off{background:#d6cfbd; color:#6d5a48; border-color:#b3a68c}
.sheet [hidden]{display:none}

/* ---------- cta ---------- */
.dl{display:grid; justify-items:center; gap:16px; text-align:center}
.dlbtn{
  display:inline-flex; align-items:center; gap:12px;
  background:var(--wood); color:var(--ink); text-decoration:none;
  border:2px solid var(--frame); border-bottom-width:3px;
  font:600 14px var(--mono); letter-spacing:.13em; text-transform:uppercase;
  padding:16px 28px; box-shadow:0 8px 22px rgba(0,0,0,.5);
}
.dlbtn:hover{background:var(--wood-lit); color:#fff}
.dlbtn .arw{color:var(--warn); font-size:16px; line-height:1}
.dlmeta{margin:0; font-size:13px; color:var(--ink-dim)}
.dlmeta b{color:var(--accent); font-weight:600}
.dlfine{margin:0; font-size:12.5px; color:var(--muted); max-width:52ch}

footer{border-top:1px solid #1c130d; padding:30px 0 50px; color:var(--muted); font-size:12.5px}
footer .col{display:flex; gap:10px 26px; flex-wrap:wrap; align-items:baseline}
footer .spacer{flex:1}
footer .dom a{color:var(--accent); text-decoration:none}
footer .dom a:hover{text-decoration:underline}

@media (prefers-reduced-motion:reduce){*{animation-duration:.001ms !important; transition-duration:.001ms !important}}
</style>

</head>
<body>
<div class="wrap">

<section class="hero">
  <div class="brandline">
    <div class="brand">VAL<em>E</em>Y</div>
    <div class="tag" data-t="tag"></div>
    <div class="langbar" role="group" aria-label="Language">
      <button data-lang="en" aria-pressed="true">EN</button>
      <button data-lang="ru" aria-pressed="false">RU</button>
    </div>
  </div>
  <h1 data-t="h1"></h1>
  <p class="lede" data-t="lede"></p>

  <div class="office">
    <div class="screen">
      <canvas id="floor" width="400" height="225" tabindex="0" role="application"></canvas>
      <div class="hud">
        <b>VALEY</b>
        <span class="chip" data-t="hudAgents"></span>
        <span class="chip work" data-t="hudWork"></span>
        <span class="chip wait" data-t="hudWait"></span>
        <span class="chip" data-t="hudLimit"></span>
        <span class="spacer"></span>
        <span class="chip" id="hud-room"></span>
      </div>
      <div class="talk" id="talk" hidden>
        <div class="body">
          <div class="who"><b id="t-name"></b><span class="role" id="t-role"></span><span class="chip" id="t-when" style="color:var(--muted);font-size:11px"></span></div>
          <div class="act" id="t-act"></div>
          <p class="say" id="t-say"></p>
          <div class="esc" data-t="escHint"></div>
        </div>
      </div>
      <div class="pad" aria-hidden="true">
        <div>
          <button data-k="ArrowLeft">←</button><button data-k="ArrowUp">↑</button><button data-k="ArrowRight">→</button>
          <button></button><button data-k="ArrowDown">↓</button><button></button>
        </div>
        <div style="grid-template-columns:88px">
          <button class="act" data-k=" " data-t="padTalk"></button>
        </div>
      </div>
      <button class="veil" id="veil">
        <span class="play" data-t="enter"></span>
        <small data-t="enterHint"></small>
      </button>
    </div>
    <div class="keys">
      <span><kbd>WASD</kbd><span data-t="keyWalk"></span></span>
      <span><kbd>SHIFT</kbd><span data-t="keyRun"></span></span>
      <span><kbd data-t="keySpace"></kbd><span data-t="keyTalk"></span></span>
      <span><kbd>ESC</kbd><span data-t="keyBack"></span></span>
    </div>
    <div class="cast">
      <canvas id="cast-face" width="30" height="34" aria-hidden="true"></canvas>
      <div class="cast-body">
        <div class="cast-eyebrow" data-t="castEyebrow"></div>
        <div class="cast-line"><b id="cast-name"></b><span class="cast-role" id="cast-role"></span></div>
        <p class="cast-hint" data-t="castHint"></p>
      </div>
      <button class="cast-roll" id="cast-roll"><span class="arw" aria-hidden="true">&#8635;</span><span data-t="castBtn"></span></button>
    </div>
  </div>
</section>

<section>
  <div class="col">
    <div class="eyebrow" data-t="ebWhy"></div>
    <h2 data-t="whyH"></h2>
    <p class="lede" data-t="whyP1"></p>
    <p class="lede" data-t="whyP2"></p>

    <div class="pillars">
      <div class="pillar">
        <canvas width="44" height="44" data-glyph="wait"></canvas>
        <h3 data-t="p1h"></h3>
        <p data-t="p1p"></p>
      </div>
      <div class="pillar">
        <canvas width="44" height="44" data-glyph="board"></canvas>
        <h3 data-t="p2h"></h3>
        <p data-t="p2p"></p>
      </div>
      <div class="pillar">
        <canvas width="44" height="44" data-glyph="note"></canvas>
        <h3 data-t="p3h"></h3>
        <p data-t="p3p"></p>
      </div>
    </div>
  </div>
</section>

<section>
  <div class="col">
    <div class="eyebrow" data-t="ebPriv"></div>
    <h2 data-t="privH"></h2>
    <p class="note" data-t="privP"></p>
    <p style="margin-top:22px; color:var(--muted); font-size:13.5px" data-t="privSmall"></p>
  </div>
</section>

<section>
  <div class="col">
    <div class="eyebrow" data-t="ebNext"></div>
    <h2 data-t="nextH"></h2>
    <p class="lede" data-t="nextP1"></p>
    <p data-t="nextP2"></p>
    <p data-t="nextP3"></p>
  </div>

  <div class="sheet">
    <div class="sheet-head"><span class="pin"></span><span data-t="sheetHead"></span><span class="n" id="pl-total">&nbsp;</span></div>
    <div class="sheet-body">
      <p class="ask" data-t="ask"></p>

      <div class="buckets" id="pl-buckets">
        <button data-k="s"></button>
        <button data-k="m"></button>
        <button data-k="l"></button>
        <button data-k="xl"></button>
      </div>

      <div class="tally" id="pl-tally" hidden></div>
      <p class="said" id="pl-said" hidden></p>
      <p class="err" id="pl-err" hidden style="color:#8c2f22;font-size:13px"></p>

      <div class="reach">
        <p data-t="reachP"></p>
        <a id="pl-form" href="#" hidden data-t="reachBtn"></a>
        <span class="off" id="pl-form-off" data-t="reachOff"></span>
      </div>
    </div>
  </div>
</section>

<section style="padding-top:0">
  <div class="col" style="text-align:center; margin-bottom:20px">
    <h2 style="font-size:clamp(18px,2.8vw,24px)" data-t="ctaH"></h2>
  </div>
  <div class="dl">
    <a class="dlbtn" href="https://valey.dev"><span class="arw">&#8595;</span><span data-t="ctaBtn"></span></a>
    <p class="dlmeta"><b>valey.dev</b><span data-t="ctaMeta"></span></p>
    <p class="dlfine" data-t="ctaFine"></p>
  </div>
</section>

<footer>
  <div class="col">
    <span>Valey</span>
    <span class="dom"><a href="https://valey.dev">valey.dev</a></span>
    <span class="spacer"></span>
    <span>macOS</span>
    <span data-t="ftDeps"></span>
    <span data-t="ftLocal"></span>
  </div>
</footer>

</div>

<script type="application/json" id="wl-state">{"pulse":{"s":1,"m":0,"l":0,"xl":0}}</script>
<script>

   Английский по умолчанию: страница для тех, кто ищет такое на английском.
   Выбор запоминается, и всё, что нарисовано на холсте, переводится тоже. */
var LANG = 'en';
var I18N = {

    hudAgents: '8 agents', hudWork: '4 working', hudWait: '3 waiting on you', hudLimit: '1 out of quota',

    enter: '▶ enter the office',

    keyWalk: 'walk', keyRun: 'run', keySpace: 'SPACE', keyTalk: 'talk', keyBack: 'back',

    castRoles: { code: 'Developer', design: 'Designer', research: 'Researcher',
                 plan: 'Product', qa: 'QA', release: 'Release engineer' },
    talkHint: 'SPACE — talk', switchHint: 'SPACE — по-русски',
    ebWhy: 'why',
    whyH: 'Eight sessions. Three are waiting on you. You don\'t know which.',
    whyP1: 'A list of chats doesn\'t show state. A terminal shows one at a time. The more agents you run, the less you know what\'s going on — and the longer one of them stands there with its hand up, to nobody.',
    whyP2: 'The office shows all of it at once, in a glance, without a single click.',
    p1h: 'Who\'s waiting reads from the corridor',
    p1p: 'A bubble over the head: <b style="color:var(--accent)">···</b> working, <b style="color:var(--warn)">!</b> waiting on you, <b style="color:var(--muted)">z z</b> out of quota. A queue that exists in neither the app nor the terminal.',

function t(k) { return I18N[LANG][k]; }
function applyLang(l) {
  LANG = l === 'ru' ? 'ru' : 'en';
  try { localStorage.setItem('ai-valey-lang', LANG); } catch {}
  document.documentElement.lang = LANG;
  for (const el of document.querySelectorAll('[data-t]')) {
    const v = I18N[LANG][el.dataset.t];
    if (v != null) el.innerHTML = v;
  }
  const floor = document.getElementById('floor');
  if (floor) floor.setAttribute('aria-label', t('canvasLabel'));
  for (const b of document.querySelectorAll('#pl-buckets button')) b.textContent = t('b' + b.dataset.k);
  for (const b of document.querySelectorAll('.langbar button')) b.setAttribute('aria-pressed', String(b.dataset.lang === LANG));
  document.dispatchEvent(new CustomEvent('langchange'));
}
(() => {
  let start = 'en';
  try { const v = localStorage.getItem('ai-valey-lang'); if (v === 'ru' || v === 'en') start = v; } catch {}
  applyLang(start);
  for (const b of document.querySelectorAll('.langbar button')) {
    b.addEventListener('click', () => applyLang(b.dataset.lang));
  }
})();
</script>
<script>
/* Слепок разметки, снятый сразу после разбора страницы: из него собирается новая
   версия при записи. Живой DOM для этого не годится — в нём уже наши следы. */
var PRISTINE = '';
document.addEventListener('DOMContentLoaded', () => { PRISTINE = document.documentElement.outerHTML; });
</script>
<script type="module">
/* ============================================================
   Демо-этаж: НАСТОЯЩИЙ офис из web/, только агенты выдуманы.
   Вся отрисовка, план этажа и столкновения приезжают из тех же модулей,
   которыми живёт приложение — см. шапку landing.js о том, почему второй
   движок был снесён, а не починен.
   ============================================================ */
import { createFloor, AGENTS } from './landing.js';
import { lookOf, drawPerson } from './sprites.js';

const view = document.getElementById('floor');
const talk = document.getElementById('talk');
const hudRoom = document.getElementById('hud-room');
const veil = document.getElementById('veil');

const floor = createFloor(view, {
  talkHint: () => (LANG === 'ru' ? 'ПРОБЕЛ' : 'SPACE'),
  onRoom: (name) => { hudRoom.textContent = name || t('corridor'); },
});

function openTalk(a) {
  const w = a[LANG];
  document.getElementById('t-name').textContent = w.name;
  const role = document.getElementById('t-role');
  role.textContent = w.role; role.className = 'role ' + a.mood;
  document.getElementById('t-when').textContent = w.when;
  document.getElementById('t-act').textContent = w.act;
  document.getElementById('t-say').textContent = w.say;
  talk.hidden = false;
}
function closeTalk() { floor.close(); talk.hidden = true; }
document.addEventListener('langchange', () => { const a = floor.talking(); if (a) openTalk(a); });

const enter = () => { veil.hidden = true; floor.focus(true); view.focus(); };
const leave = () => { veil.hidden = false; floor.focus(false); closeTalk(); };
veil.addEventListener('click', enter);
view.addEventListener('focus', enter);
view.addEventListener('blur', leave);

const OWNED = new Set(['w','a','s','d','arrowup','arrowdown','arrowleft','arrowright',' ','shift','escape']);
window.addEventListener('keydown', (e) => {
  const k = e.key.toLowerCase();
  if (veil.hidden === false || !OWNED.has(k)) return;
  e.preventDefault();
  if (k === 'escape') { if (floor.talking()) closeTalk(); else view.blur(); return; }
  if (k === ' ') { const a = floor.act(); if (a) openTalk(a); else talk.hidden = true; return; }
  floor.key(k, true);
});
window.addEventListener('keyup', (e) => floor.key(e.key.toLowerCase(), false));

for (const b of document.querySelectorAll('.pad button[data-k]')) {
  const k = b.dataset.k.toLowerCase();
  const down = (e) => { e.preventDefault(); veil.hidden = true; floor.focus(true);
    if (k === ' ') { const a = floor.act(); if (a) openTalk(a); else talk.hidden = true; }
    else floor.key(k, true); };
  const up = (e) => { e.preventDefault(); floor.key(k, false); };
  b.addEventListener('pointerdown', down);
  b.addEventListener('pointerup', up);
  b.addEventListener('pointercancel', up);
}

/* ---------- кто ты в офисе ----------
   Внешность берётся из sprites.js — той самой, что раздаёт лица агентам:
   головные уборы, растительность и что человек держит в руках приезжают
   сюда сами, без второго списка палитр. */
const CAST_NAMES = [
  { ru: 'Пётр', en: 'Pyotr' },   { ru: 'Марк', en: 'Mark' },     { ru: 'Гоша', en: 'Gosha' },
  { ru: 'Тимка', en: 'Timka' },  { ru: 'Сеня', en: 'Senya' },    { ru: 'Гриша', en: 'Grisha' },
  { ru: 'Лёва', en: 'Lyova' },   { ru: 'Стёпа', en: 'Styopa' },  { ru: 'Кузя', en: 'Kuzya' },
  { ru: 'Митя', en: 'Mitya' },   { ru: 'Никита', en: 'Nikita' }, { ru: 'Савва', en: 'Savva' },
  { ru: 'Ася', en: 'Asya' },     { ru: 'Лиза', en: 'Liza' },     { ru: 'Глаша', en: 'Glasha' },
  { ru: 'Марта', en: 'Marta' },  { ru: 'Дина', en: 'Dina' },     { ru: 'Нина', en: 'Nina' },
  { ru: 'Зоя', en: 'Zoya' },     { ru: 'Рита', en: 'Rita' },     { ru: 'Ева', en: 'Eva' },
  { ru: 'Тася', en: 'Tasya' },   { ru: 'Фрося', en: 'Frosya' },  { ru: 'Муза', en: 'Muza' },
];
const CAST_ROLE_KEYS = ['code', 'design', 'research', 'plan', 'qa', 'release'];
const CAST_ROLE_COLOR = {
  code: '#9fe0a8', design: '#c39bff', research: '#8fc8ff',
  plan: '#ffd166', qa: '#d4707f', release: '#7aa85a',
};

const faceCv = document.getElementById('cast-face');
const fctx = faceCv.getContext('2d');
const nameEl = document.getElementById('cast-name');
const roleEl = document.getElementById('cast-role');
let cast = null;

function renderCast() {
  if (!cast) return;
  nameEl.textContent = cast.name[LANG];
  roleEl.textContent = t('castRoles')[cast.role];
  roleEl.style.color = CAST_ROLE_COLOR[cast.role];
  fctx.clearRect(0, 0, faceCv.width, faceCv.height);
  drawPerson(fctx, faceCv.width / 2, faceCv.height - 3, cast.look, { pose: 'stand', frame: 0, dir: 0 });
}
function rollCast() {
  // внешность считается от ЛАТИНСКОГО написания: иначе переключение языка
  // меняло бы человеку лицо посреди просмотра
  const name = CAST_NAMES[Math.floor(Math.random() * CAST_NAMES.length)];
  const role = CAST_ROLE_KEYS[Math.floor(Math.random() * CAST_ROLE_KEYS.length)];
  cast = { name, role, look: lookOf(name.en + role) };
  floor.setLook(cast.look);      // по этажу дальше ходишь именно им
  renderCast();
}
document.getElementById('cast-roll').addEventListener('click', rollCast);
document.addEventListener('langchange', renderCast);
rollCast();

/* ---------- пиксельные значки блоков ---------- */
(() => {
  const draw = {
    wait(p) {
      p(14, 10, 16, 10, '#241710'); p(21, 20, 2, 2, '#241710');
      p(21, 12, 2, 5, '#ffd166'); p(21, 18, 2, 1, '#ffd166');
      p(18, 26, 8, 8, '#e8ad7e'); p(18, 25, 8, 2, '#6b3f2a');
      p(15, 34, 14, 8, '#4a7fa8'); p(13, 35, 2, 5, '#4a7fa8'); p(29, 35, 2, 5, '#4a7fa8');
      p(20, 29, 1, 1, '#2b2118'); p(23, 29, 1, 1, '#2b2118');
    },
    board(p) {
      p(7, 8, 30, 26, '#8a6247'); p(9, 10, 26, 22, '#e9e3d4');
      p(12, 13, 8, 7, '#9fe0a8'); p(23, 13, 8, 7, '#ffd166'); p(12, 23, 8, 6, '#8fc8ff'); p(23, 23, 8, 6, '#c39bff');
      p(9, 34, 26, 2, '#5f4534'); p(14, 36, 3, 6, '#4a3325'); p(27, 36, 3, 6, '#4a3325');
    },
    note(p) {
      p(6, 24, 32, 12, '#4a3325'); p(6, 24, 32, 2, '#6b4a2e');
      p(11, 10, 20, 14, '#f6e3c0'); p(14, 14, 14, 2, '#8c7660'); p(14, 18, 10, 2, '#8c7660');
      p(30, 6, 8, 2, '#9fe0a8'); p(34, 4, 2, 2, '#9fe0a8'); p(34, 8, 2, 2, '#9fe0a8');
    },
  };
  for (const c of document.querySelectorAll('canvas[data-glyph]')) {
    const x = c.getContext('2d');
    const p = (a, b, w, h, col) => { x.fillStyle = col; x.fillRect(a, b, w, h); };
    draw[c.dataset.glyph](p);
  }
})();

/* ---------- замер спроса ----------
   Страница хранит четыре числа и больше ничего. Персональных данных здесь нет
   и быть не должно: всё, что опубликовано, видно каждому, у кого есть ссылка. */
(() => {
  // Твоя форма для контактов. Пока в ссылке остаётся XXXXXX, кнопка выключена,
  // чтобы со страницы не вела битая ссылка.
  const FORM_URL = 'https://tally.so/r/Np14eO';

  const LABEL = (k) => t('b' + k);
  const MINE = 'ai-valey-pulse';
  const box = document.getElementById('pl-buckets');
  const tally = document.getElementById('pl-tally');
  const said = document.getElementById('pl-said');
  const err = document.getElementById('pl-err');
  const totalEl = document.getElementById('pl-total');

  const link = document.getElementById('pl-form');
  const off = document.getElementById('pl-form-off');
  if (!/XXXXXX/.test(FORM_URL)) { link.href = FORM_URL; link.target = '_blank'; link.rel = 'noopener noreferrer'; link.hidden = false; off.hidden = true; }

  let pulse = { s: 0, m: 0, l: 0, xl: 0 };
  try { Object.assign(pulse, (JSON.parse(document.getElementById('wl-state').textContent) || {}).pulse); } catch {}

  let mine = null;
  try { mine = localStorage.getItem(MINE); } catch {}

  const total = () => Object.values(pulse).reduce((a, b) => a + b, 0);

  function plural(n) {
    if (LANG === 'en') return n === 1 ? t('one') : t('many');
    if (n % 10 === 1 && n % 100 !== 11) return t('one');
    if (n % 10 >= 2 && n % 10 <= 4 && (n % 100 < 10 || n % 100 >= 20)) return t('few');
    return t('many');
  }

  function render() {
    const n = total();
    // всё, что здесь ставится, ставится в обе стороны: этот же DOM уходит
    // в опубликованную версию, и чужая страница не должна унести чужое состояние
    said.hidden = !mine;
    said.textContent = mine ? t('noted') + LABEL(mine) + t('thanks') : '';
    for (const btn of box.querySelectorAll('button')) btn.disabled = !!mine;
    totalEl.textContent = n ? n + ' ' + plural(n) : t('empty');
    if (!n) { tally.hidden = true; tally.textContent = ''; return; }
    tally.hidden = false;
    tally.textContent = '';
    for (const k of ['s', 'm', 'l', 'xl']) {
      const share = Math.round((pulse[k] / n) * 100);
      const line = document.createElement('div');
      line.className = 'line' + (mine === k ? ' mine' : '');
      const lab = document.createElement('div'); lab.className = 'lab';
      const b = document.createElement('b'); b.textContent = LABEL(k);
      if (mine === k) b.dataset.you = t('you');
      const v = document.createElement('span'); v.textContent = share + '% · ' + pulse[k];
      lab.append(b, v);
      const track = document.createElement('div'); track.className = 'track';
      const fill = document.createElement('div'); fill.className = 'fill'; fill.style.width = share + '%';
      track.append(fill); line.append(lab, track); tally.append(line);
    }
  }
  render();
  document.addEventListener('langchange', render);

  const useCap = (n) => (window.claude && window.claude.use)
    ? Promise.resolve(window.claude.use(n)).catch(() => null)
    : Promise.resolve(null);
  let api = null, asked = false;
  useCap('artifact').then((a) => { api = a; asked = true; });

  box.addEventListener('click', async (e) => {
    const btn = e.target.closest('button[data-k]');
    if (!btn || mine) return;
    const k = btn.dataset.k;
    err.hidden = true;
    for (const x of box.querySelectorAll('button')) x.disabled = true;

    if (!api && !asked) api = await useCap('artifact');
    if (!api || !PRISTINE) {
      for (const x of box.querySelectorAll('button')) x.disabled = false;
      err.textContent = t('errNoStore');
      err.hidden = false;
      return;
    }

    const next = Object.assign({}, pulse); next[k] = (next[k] || 0) + 1;
    const doc = PRISTINE.replace(
      /(<script type="application\/json" id="wl-state">)[\s\S]*?(<\/script>)/,
      (_m, open, close) => open + JSON.stringify({ pulse: next }) + close
    );

    try {
      await api.publish('<!doctype html>' + doc);
      try { localStorage.setItem(MINE, k); } catch {}
      pulse = next; mine = k; render();
    } catch (ex) {
      const code = ex && ex.code;
      for (const x of box.querySelectorAll('button')) x.disabled = false;
      err.textContent = code === 'conflict' ? t('errConflict')
        : (code === 'not_granted' || code === 'not_writer') ? t('errReadonly')
        : t('errGeneric');
      err.hidden = false;
    }
  });
})();

</script>
